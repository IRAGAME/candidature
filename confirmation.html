<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Confirmation - Stitch Global</title>
  <link rel="preconnect" href="https://fonts.googleapis.com"/>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"/>
  <link rel="stylesheet" href="assets/css/style.css"/>
</head>
<body style="min-height:100vh;display:flex;flex-direction:column;">

<div id="sg-header-placeholder"></div>

<main class="sg-container-narrow" style="flex:1;padding-top:64px;padding-bottom:64px;text-align:center;">
  <div class="card" style="max-width:560px;margin:0 auto;padding:44px 32px;">
    <div style="width:76px;height:76px;border-radius:50%;background:var(--success);color:#fff;display:flex;align-items:center;justify-content:center;margin:0 auto 24px;box-shadow:0 16px 30px rgba(33,166,122,.30);">
      <svg width="40" height="40" viewBox="0 0 24 24" fill="none" aria-hidden="true">
        <path d="M5 12l4 4L19 7" stroke="#fff" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <h1 style="font-size:28px;font-weight:800;margin:0 0 10px;letter-spacing:-0.02em;">Candidature envoyée !</h1>
    <p style="color:#a6aec2;font-size:15px;line-height:1.6;margin:0 0 24px;">
      Merci, votre dossier a bien été transmis au service des admissions.
      Vous recevrez une réponse sous 10 jours ouvrés.
    </p>

    <div style="height:150px;border-radius:16px;overflow:hidden;margin:0 0 24px;box-shadow:var(--shadow-sm);">
      <img src="assets/images/hero-campus.jpg" alt="Campus" style="width:100%;height:100%;object-fit:cover;"/>
    </div>

    <a class="btn btn-primary" href="index.html" style="width:100%;">Retour à l'accueil</a>
  </div>
</main>

<div id="sg-footer-placeholder"></div>

<script src="assets/js/config.js"></script>
<script src="assets/js/components.js"></script>
</body>
</html>
